<script>
(() => {
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Lift the header off the page once it starts scrolling.
  const header = document.querySelector('.site-header');
  const onScroll = () => header.classList.toggle('is-scrolled', scrollY > 4);
  addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  // Theme toggle. Picking the theme the system already uses clears the
  // override, so the page follows the system again.
  const root = document.documentElement;
  const systemDark = matchMedia('(prefers-color-scheme: dark)');
  const toggle = document.querySelector('.theme-toggle');
  const themeColors = document.querySelectorAll('meta[name="theme-color"]');
  const currentTheme = () => root.dataset.theme || (systemDark.matches ? 'dark' : 'light');
  const syncToggle = () => {
    const theme = currentTheme();
    toggle.dataset.current = theme;
    toggle.setAttribute('aria-label', `Switch to ${theme === 'dark' ? 'light' : 'dark'} theme`);
    const background = getComputedStyle(document.body).backgroundColor;
    themeColors.forEach((meta) => { meta.content = background; });
  };
  const setTheme = (theme) => {
    const followsSystem = theme === (systemDark.matches ? 'dark' : 'light');
    if (followsSystem) delete root.dataset.theme;
    else root.dataset.theme = theme;
    try {
      if (followsSystem) localStorage.removeItem('theme');
      else localStorage.setItem('theme', theme);
    } catch {}
    syncToggle();
  };
  toggle.addEventListener('click', () => {
    const next = currentTheme() === 'dark' ? 'light' : 'dark';
    if (reduceMotion || !document.startViewTransition) return setTheme(next);
    const { left, top, width, height } = toggle.getBoundingClientRect();
    const x = left + width / 2;
    const y = top + height / 2;
    const radius = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
    root.classList.add('theme-switching');
    const transition = document.startViewTransition(() => setTheme(next));
    transition.ready.then(() => root.animate(
      { clipPath: [`circle(0 at ${x}px ${y}px)`, `circle(${radius}px at ${x}px ${y}px)`] },
      { duration: 550, easing: 'cubic-bezier(.2,.7,.2,1)', pseudoElement: '::view-transition-new(root)' },
    ));
    transition.finished.finally(() => root.classList.remove('theme-switching'));
  });
  systemDark.addEventListener('change', syncToggle);
  syncToggle();
  toggle.hidden = false;

  if (!('IntersectionObserver' in window)) return;

  // Fade content in as it scrolls into view. Only elements that start below the
  // fold are hidden, so nothing visible on load flickers, and without JS
  // everything simply renders.
  if (!reduceMotion) {
    const reveal = new IntersectionObserver((entries) => {
      entries.filter((e) => e.isIntersecting).forEach((e, i) => {
        const el = e.target;
        el.style.transitionDelay = `${i * 70}ms`;
        el.classList.add('is-visible');
        const settle = (event) => {
          if (event.target !== el) return; // ignore transitions bubbling up from links inside
          el.removeEventListener('transitionend', settle);
          el.classList.remove('reveal', 'is-visible');
          el.style.transitionDelay = '';
        };
        el.addEventListener('transitionend', settle);
        reveal.unobserve(el);
      });
    }, { rootMargin: '0px 0px -6% 0px' });
    document.querySelectorAll('.home-section > h2, .home-section > p, .section-heading, .group-title, .subsection-heading, .news-list li, .publication, .experience-item, .education-item, .cv-paper-list li, .main-content > :not(section)').forEach((el) => {
      if (el.getBoundingClientRect().top > innerHeight) {
        el.classList.add('reveal');
        reveal.observe(el);
      }
    });
  }

  // Highlight the nav link for the homepage section in view.
  const spied = new Map();
  document.querySelectorAll('.nav-links a[href*="#"]').forEach((a) => {
    const section = a.pathname === location.pathname && document.getElementById(a.hash.slice(1));
    if (section) spied.set(section, a);
  });
  const spy = new IntersectionObserver((entries) => {
    entries.forEach((e) => spied.get(e.target).classList.toggle('is-active', e.isIntersecting));
  }, { rootMargin: '-35% 0px -60% 0px' });
  spied.forEach((a, section) => spy.observe(section));

  // Copy buttons for BibTeX blocks.
  document.querySelectorAll('.copy-button').forEach((button) => {
    const label = button.querySelector('.copy-label');
    const source = document.getElementById(button.getAttribute('aria-controls'));
    button.hidden = !navigator.clipboard;
    button.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(source.textContent.trim());
        label.textContent = 'Copied';
        button.classList.add('is-copied');
      } catch {
        getSelection().selectAllChildren(source);
        label.textContent = 'Selected';
      }
      clearTimeout(button.resetTimer);
      button.resetTimer = setTimeout(() => {
        label.textContent = 'Copy';
        button.classList.remove('is-copied');
      }, 1800);
    });
  });
})();
</script>

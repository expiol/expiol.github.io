# Basic Site Settings
locale                   : "en-US"
site_theme               : "default"
title                    : "Yang Hong"
title_separator          : "-"
name                     : &name "Yang Hong"
description              : &description "Yang Hong is building a startup and researching AI security: language model safety, multi-agent systems, and automated penetration testing. Incoming M.S. student at Johns Hopkins University."
url                      : https://expiol.github.io    # Your GitHub Pages URL
baseurl                  : "" 
repository               : "expiol/expiol.github.io"   # Replace with your repo name if different

# Site Author - Sidebar Information
author:
  avatar           : "yang-hong.jpg"
  name             : "Yang Hong"
  pronouns         : "he/him"
  role             : "Building a startup"
  focus            : "AI security research"
  location         :
  employer         :
  uri              : https://expiol.github.io
  email            : "yhong51@jh.edu"

  # Single source for the sidebar focus list and the homepage interest tags
  interests:
    - "LLM safety & privacy"
    - "Multi-agent security"
    - "Automated penetration testing"

  # Academic websites
  googlescholar    : # Add your Google Scholar when available
  orcid            : # Add your ORCID when available
  researchgate     : # Add if you have
  scopus           : 

  # Repositories
  github           : "expiol"

  # Social media
  linkedin         : # Add LinkedIn if you have
  twitter          : # Add X/Twitter if you use
  zhihu            : # Optional if you want Chinese profile

# Publication Categories
publication_category:
  published:
    title: "Published Papers"
  manuscripts:
    title: "Manuscripts"


# Site Settings
teaser                   : 
breadcrumbs              : false
words_per_minute         : 160
future                   : false
read_more                : "disabled"
talkmap_link             : false
comments:
  provider               : false 

# SEO
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# Analytics
analytics:
  provider               : "false" 

# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - files/Yang-Hong-CV.pdf
  - _posts
  - _drafts
  - _talks
  - _teaching
  - _portfolio
  - talkmap
  - markdown_generator
  - scripts
  - CONTRIBUTING.md
  - README.md
  - docker-compose.yaml
  - talkmap.py
  - talkmap.ipynb
  - talkmap_out.ipynb
  - _pages/archive-layout-with-content.md
  - _pages/category-archive.html
  - _pages/collection-archive.html
  - _pages/cv-json.md
  - _pages/markdown.md
  - _pages/non-menu-page.md
  - _pages/page-archive.html
  - _pages/portfolio.html
  - _pages/tag-archive.html
  - _pages/talkmap.html
  - _pages/talks.html
  - _pages/teaching.html
  - _pages/terms.md
  - _pages/year-archive.html
  - files/bibtex1.bib
  - files/paper1.pdf
  - files/paper2.pdf
  - files/paper3.pdf
  - files/slides1.pdf
  - files/slides2.pdf
  - files/slides3.pdf
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/css/main.scss
  - assets/css/academicons.css
  - assets/css/academicons.min.css
  - assets/css/collapse.css
  - assets/js
  - assets/fonts
  - assets/webfonts
  - images/1.png
  - images/500x300.png
  - images/bio-photo.jpg
  - images/bio-photo-2.jpg
  - images/editing-talk.png
  - images/profile.png
  - images/themes
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: false
  - scope:
      path: ""
      type: publications
    values:
      layout: academic-publication
      author_profile: true
      share: true
      comments: false
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comments: false
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed 

# Output
permalink: /:categories/:title/
timezone: Asia/Shanghai 

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# Basic Site Settings
locale                   : "en-US"
site_theme               : "default"
title                    : "Yang Hong - Academic Homepage"
title_separator          : "-"
name                     : &name "Yang Hong"
description              : &description "Yang Hong's academic portfolio in cybersecurity and AI"
url                      : https://expiol.github.io    # Your GitHub Pages URL
baseurl                  : "" 
repository               : "expiol/expiol.github.io"   # Replace with your repo name if different

# Site Author - Sidebar Information
author:
  avatar           : "profile.png"
  name             : "Yang Hong"
  pronouns         : "he/him"  
  bio              : "Undergraduate researcher in cybersecurity and large language models at XJTLU."
  location         : "Suzhou, China"
  employer         : "Xi’an Jiaotong-Liverpool University"
  uri              : 
  email            : "yang.hong22@student.xjtlu.edu.cn"

  # Academic websites
  googlescholar    : # Add your Google Scholar when available
  orcid            : # Add your ORCID when available
  researchgate     : # Add if you have
  scopus           : 

  # Repositories
  github           : "expiol"

  # Social media
  linkedin         : # Add LinkedIn if you have
  twitter          : # Add X/Twitter if you use
  zhihu            : # Optional if you want Chinese profile

# Publication Categories
publication_category:
  published:
    title: "Published Papers"
  manuscripts:
    title: "Manuscripts"


# Site Settings
teaser                   : 
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false
comments:
  provider               : false 

atom_feed:
  hide                   : false     

# SEO
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# Analytics
analytics:
  provider               : "false" 

# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: false
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: false
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comments: false
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed 

# Output
permalink: /:categories/:title/
timezone: Asia/Shanghai 

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development
